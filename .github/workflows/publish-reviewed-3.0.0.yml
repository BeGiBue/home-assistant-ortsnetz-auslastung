name: Publish reviewed 3.0.0 after tests

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Release only the approved 3.0.0 version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" == "3.0.0" ]] || { echo "Not the approved version"; exit 0; }
          [[ "$(jq -r .version custom_components/ortsnetz_map/manifest.json)" == "$VERSION" ]]
          [[ "$(head -n 1 custom_components/ortsnetz_map/www/ortsnetz-map-card.js)" == "// Ortsnetz Map Card v$VERSION" ]]
          test -s RELEASE_NOTES_3.0.0.md
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)"
          [[ "$MAIN_SHA" == "$SOURCE_SHA" ]] || { echo "Main advanced, not publishing outdated SHA"; exit 0; }
          if gh release view v3.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v3.0.0 already released"; exit 0
          fi
          gh release create v3.0.0 --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "3.0.0" --notes-file RELEASE_NOTES_3.0.0.md --latest
